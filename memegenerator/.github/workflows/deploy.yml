name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancelar el que ya esté en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `npm ci` se colgo 7 minutos en silencio con la cache ya restaurada, sin
      # un solo aviso en el registro: espera de red. --no-audit quita la
      # consulta de vulnerabilidades, que es una llamada aparte al registro, y
      # --prefer-offline hace que tire de la cache antes que de la red. El
      # build no necesita ninguna de las dos.
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
